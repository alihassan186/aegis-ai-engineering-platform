[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "aegis"
version = "0.3.0"
description = "AEGIS incident investigation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "boto3>=1.43.89",
    "fastapi>=0.115.0",
    "langgraph>=1.0,<2",
    "pyjwt>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: optional live AWS or Docker checks (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.params.Depends",
    "fastapi.params.Query",
    "aegis.api.dependencies.require_permission",
    "aegis.api.dependencies.require_role",
]

[tool.ruff.lint.isort]
known-first-party = ["aegis", "apps"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "apps"]
mypy_path = ["."]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true
